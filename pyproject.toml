[project]
name = "policy-lab"
version = "0.1.0"
description = "AI-assisted, human-led open-source policy decision support framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nextain" }]
keywords = ["policy", "deliberation", "human-ai", "governance", "reproducibility"]
dependencies = []

[project.optional-dependencies]
event-tool = ["fastapi>=0.135,<1", "uvicorn>=0.42,<1"]
test = ["pytest>=8", "beautifulsoup4>=4.12", "jsonschema[format]>=4.26,<5", "cryptography>=44,<46", "playwright>=1.58,<2", "fastapi>=0.135,<1", "httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/nextain/aipol"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policy_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
